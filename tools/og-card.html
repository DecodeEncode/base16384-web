<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>base16384 web card</title>
<!-- Source of images/og.png (1200×630); rendered by tools/screenshots.mjs. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f7f6f3; color: #1b1d21; font-family: system-ui, sans-serif; position: relative; }
  .logo { position: absolute; left: 80px; top: 76px; width: 96px; height: 96px; border-radius: 16px; background: #1b1d21; color: #f7f6f3; display: grid; place-items: center; font: 60px/1 serif; }
  .logo i { position: absolute; right: 12px; bottom: 12px; width: 16px; height: 16px; border-radius: 3px; background: #a8392a; }
  h1 { position: absolute; left: 204px; top: 70px; margin: 0; font-size: 72px; font-weight: 700; letter-spacing: -.01em; }
  h1 span { font-weight: 400; color: #555b63; }
  .sub { position: absolute; left: 207px; top: 160px; margin: 0; font-size: 28px; color: #555b63; }
  .ex { position: absolute; left: 82px; top: 268px; font-size: 30px; color: #555b63; }
  .ex b { font-weight: 500; color: #1b1d21; font-family: ui-monospace, monospace; }
  .out { position: absolute; left: 78px; top: 316px; font: 76px/1.2 serif; letter-spacing: .04em; }
  .out .m { color: #a8392a; }
  canvas { position: absolute; right: 80px; top: 280px; width: 256px; height: 160px; image-rendering: pixelated; border: 1px solid #767c85; border-radius: 4px; }
  .foot { position: absolute; left: 82px; right: 80px; bottom: 54px; display: flex; justify-content: space-between; font-size: 24px; white-space: nowrap; color: #555b63; }
</style>
</head>
<body>
<div class="logo" lang="zh">一<i></i></div>
<h1>base16384 <span>web</span></h1>
<p class="sub">encode, decode, inspect and benchmark in the browser</p>
<div class="ex"><b>"12345678"</b> becomes</div>
<div class="out" id="out" lang="zh"></div>
<canvas id="map" width="64" height="40"></canvas>
<div class="foot"><span>14 bits per character · nothing uploaded</span><span>decodeencode.github.io/base16384-web</span></div>
<script type="module">
  import { encode, MARK } from "../vendor/base16384.mjs";
  const out = document.getElementById("out");
  for (const c of encode(new TextEncoder().encode("12345678"))) {
    const s = document.createElement("span");
    s.textContent = c;
    if (c.charCodeAt(0) >= MARK && c.charCodeAt(0) <= MARK + 6) s.className = "m";
    out.append(s);
  }
  // a small byte map of structured data: a header, zero runs, a ramp and a block of FF
  const bytes = [];
  for (let row = 0; row < 40; row++) for (let x = 0; x < 64; x++)
    bytes.push(row < 2 ? (x * 37) & 255 : row < 14 ? 0 : row < 26 ? (x * 4) & 255 : row < 32 ? 255 : (x ^ row) * 3 & 255);
  const ctx = document.getElementById("map").getContext("2d"), img = ctx.createImageData(64, 40);
  bytes.forEach((b, i) => { img.data.set([255 - b, 255 - b, 255 - b, 255], i * 4); });
  ctx.putImageData(img, 0, 0);
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
